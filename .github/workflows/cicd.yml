name: Build for macOS

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: only needs to read code for building.
permissions:
  contents: read

jobs:
  build:
    name: Build izaNotch & Tests
    runs-on: macos-15
    steps:
    - name: Code Checkout
      uses: actions/checkout@v7

    - name: Run ClickyKit Tests
      run: |
        swift test --package-path Packages/ClickyKit

    - name: Build izaNotch App
      run: |
        xcodebuild -project izaNotch.xcodeproj -scheme izaNotch -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
